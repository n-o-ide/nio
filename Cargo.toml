[package]
name = "nioai"
version = "0.3.1"
edition = "2024"
rust-version = "1.89"
description = "A lightweight AI coding agent for the terminal"
license = "MIT"

[[bin]]
name = "nio"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
crossterm = "0.29"
ctrlc = { version = "3.4", features = ["termination"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
