[package]
name = "nioai"
version = "0.3.3"
edition = "2024"
rust-version = "1.89"
description = "A lightweight AI coding agent for the terminal"
license = "MIT"

[[bin]]
name = "nio"
path = "src/main.rs"

[[bin]]
name = "nio-pdf"
path = "src/bin/nio-pdf.rs"
required-features = ["pdf-plugin"]

[features]
default = []
pdf-plugin = ["dep:pdf-extract"]

[dependencies]
base64 = "0.22"
crossterm = "0.29"
ctrlc = { version = "3.4", features = ["termination"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }
unicode-segmentation = "1"
unicode-width = "0.2"
calamine = "0.31"
pdf-extract = { version = "0.10", optional = true }
quick-xml = "0.38"
sha2 = "0.10"
sha1 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
