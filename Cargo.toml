[package]
name = "nioai"
version = "0.1.0"
edition = "2024"
description = "A lightweight AI coding agent for the terminal"
license = "MIT"

[[bin]]
name = "nio"
path = "src/main.rs"

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }
